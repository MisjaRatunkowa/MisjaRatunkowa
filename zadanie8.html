<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zadanie 1</title>
<div class="audio-section">
  <button class="audio-btn" data-audio="dzwiek1.mp4"> Odtwórz nagranie 1</button>
  <button class="audio-btn" data-audio="dzwiek2.mp4"> Odtwórz nagranie 2</button>
  <button class="audio-btn" data-audio="dzwiek3.mp4"> Odtwórz nagranie 3</button>
</div>

<audio id="audioPlayer"></audio>
  <link rel="stylesheet" href="style.css?v=4">

  <style>
    /* pełnoekranowy układ */
    .audio-section {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.audio-btn {
  max-width: 320px;
}

  background: linear-gradient(135deg, #ffd54f, #ffb300);
  color: #111;

  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.audio-btn:hover {
  filter: brightness(1.05);
}
    .task-fullscreen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    /* grafika */
    .task-fullscreen img {
      width: 100%;
      height: calc(100dvh - 80px);
      object-fit: contain;
      display: block;
    }

    /* dolny pasek */
    .bottom-bar {
      height: 80px;
      padding: 12px;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
    }

    /* przycisk wróć */
    .bottom-bar a {
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;

      background: linear-gradient(#ffd54f, #ffb300);
      color: #111;
      font-weight: bold;
    }
  </style>
</head>
<script>
  const audioPlayer = document.getElementById("audioPlayer");
  const audioButtons = document.querySelectorAll(".audio-btn");

  audioButtons.forEach(button => {
    button.addEventListener("click", () => {
      const audioFile = button.getAttribute("data-audio");

      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      audioPlayer.src = audioFile;
      audioPlayer.play();
    });
  });
</script>
<body>

  <div class="task-fullscreen">
    
    <!-- TU WRZUCASZ SWOJĄ GRAFIKĘ -->
    <img src="strona8.jpg" alt="Zadanie 1">

    <div class="bottom-bar">
      <a href="index.html">WRÓĆ</a>
    </div>

  </div>

</body>
</html>
