<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zadanie 8</title>

  <link rel="stylesheet" href="style.css?v=5">

  <style>
   .task-fullscreen {
  position: fixed;
  inset: 0;
  background: #000;
}

/* obraz */
.task-fullscreen img {
  width: 100%;
  height: calc(100dvh - 80px);
  object-fit: contain;
  display: block;
  background: #000;
}

/* 🔥 guziki NA ŚRODKU */
.audio-section {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  align-items: center;
  padding: 0 20px;
}

/* guziki */
.audio-btn {
  width: 100%;
  max-width: 320px;
  padding: 14px;
  border: none;
  border-radius: 10px;

  background: linear-gradient(135deg, #ffd54f, #ffb300);
  color: #111;

  font-size: 16px;
  font-weight: bold;
}

/* dolny pasek */
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;

  height: 80px;
  padding: 12px;
  background: rgba(0,0,0,0.9);
  display: flex;
  align-items: center;
}
  </style>
</head>

<body>

  <div class="task-fullscreen">
    
    <img src="strona8.jpg" alt="Zadanie 8">

    <div class="audio-section">
      <button class="audio-btn" data-audio="dzwiek1.mp4">▶ Odtwórz nagranie 1</button>
      <button class="audio-btn" data-audio="dzwiek2.mp4">▶ Odtwórz nagranie 2</button>
      <button class="audio-btn" data-audio="dzwiek3.mp4">▶ Odtwórz nagranie 3</button>
    </div>

    <audio id="audioPlayer"></audio>

    <div class="bottom-bar">
      <a href="index.html">WRÓĆ</a>
    </div>

  </div>

  <!-- JS NA DOLE (ważne!) -->
  <script>
    const audioPlayer = document.getElementById("audioPlayer");
    const audioButtons = document.querySelectorAll(".audio-btn");

    audioButtons.forEach(button => {
      button.addEventListener("click", () => {
        const audioFile = button.getAttribute("data-audio");

        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.src = audioFile;
        audioPlayer.play();
      });
    });
  </script>

</body>
</html>
